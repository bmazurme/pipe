# Swarm stack for bridge — deployed by .github/workflows/build.yml with
#
#   docker stack deploy -c deploy/swarm/bridge-stack.yml --with-registry-auth bridge
#
# `docker stack deploy` ignores `env_file` and `build`, so every value below is
# interpolated on the CI runner from GitHub secrets.
#
# The frontend needs no runtime environment: VITE_API_URL is inlined into the
# bundle at build time by Vite, so that service ships nothing but nginx plus
# static files. The backend is the opposite — every value it reads comes from
# the environment below.
#
# Postgres is not part of this stack — it is expected to already be reachable
# (a managed instance, or a separate compose stack on the same host). A swarm
# task sits on an overlay network and cannot resolve a compose service name by
# its short name, so POSTGRES_HOST must be a routable address.
#
# Default published ports (3300/3305) follow the convention already in use on
# the target node: each stack claims a free `X0` block (backend on X000,
# frontend on X005) — see `docker stack ls` / `docker ps` on the node before
# picking a different block. Taken at the time these were chosen: 3000/3005
# (places), 3400/3405 (tools), 3450/3455 (notes), 3600/3605 (rain).
version: '3.8'

services:
  backend:
    image: ${CR_HOST:?CR_HOST is required}/${CR_REGISTRY:?CR_REGISTRY is required}/${CR_BACKEND_IMAGE:?CR_BACKEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - bridge
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:?REFRESH_JWT_SECRET is required}
      YANDEX_ID: ${YANDEX_ID:?YANDEX_ID is required}
      YANDEX_SECRET: ${YANDEX_SECRET:?YANDEX_SECRET is required}
      BRIDGE_YANDEX_REDIRECT: ${BRIDGE_YANDEX_REDIRECT:?BRIDGE_YANDEX_REDIRECT is required}
      BRIDGE_TARGET_URL: ${BRIDGE_TARGET_URL:?BRIDGE_TARGET_URL is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?COOKIE_DOMAIN is required}
      EMAILS: ${EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Optional: enables GET /api/v1/time/export/day-offs for ntlstl.time to
      # import from. Empty TIME_EXPORT_API_KEY leaves the route disabled.
      TIME_EXPORT_API_KEY: ${TIME_EXPORT_API_KEY:-}
      TIME_EXPORT_USER_ID: ${TIME_EXPORT_USER_ID:-}
      # The /api/v1/vpn/* endpoints (see src/vpn/) — backend calls ihor's
      # x-ui panel directly for status, and GitHub's API to push worker
      # secrets + trigger this same deploy workflow. GITHUB_TOKEN needs repo
      # (Actions secrets: write) + workflow (Actions: write) scope on
      # GITHUB_REPO only — least privilege, not a broad admin PAT.
      VPN_PANEL_URL: ${VPN_PANEL_URL:?VPN_PANEL_URL is required}
      VPN_PANEL_API_TOKEN: ${VPN_PANEL_API_TOKEN:?VPN_PANEL_API_TOKEN is required}
      VPN_SERVER_ADDRESS: ${VPN_SERVER_ADDRESS:?VPN_SERVER_ADDRESS is required}
      GITHUB_TOKEN: ${BRIDGE_GITHUB_TOKEN:?BRIDGE_GITHUB_TOKEN is required}
      GITHUB_REPO: ${GITHUB_REPO:?GITHUB_REPO is required}
    ports:
      - target: 3000
        published: ${BACKEND_PUBLISHED_PORT:-3300}
        protocol: tcp
        mode: ingress
    healthcheck:
      # GET / is the plain health endpoint — no auth, no DB round-trip. Proves
      # the process is up and serving, not that Postgres answers.
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.60'
          memory: 512M
        reservations:
          memory: 128M
      labels:
        app: bridge
        component: backend

  frontend:
    image: ${CR_HOST:?CR_HOST is required}/${CR_REGISTRY:?CR_REGISTRY is required}/${CR_FRONTEND_IMAGE:?CR_FRONTEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - bridge
    ports:
      - target: 80
        published: ${FRONTEND_PUBLISHED_PORT:-3305}
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        monitor: 30s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M
      labels:
        app: bridge
        component: frontend

  # The Xray client tunneling worker's AI-provider traffic out through the
  # ihor VPN server (see worker/README.md) — a plain SOCKS5 proxy on the
  # worker-net network, not reachable from bridge's own backend/frontend.
  # Config is a Swarm "config" object built at deploy time from the
  # VPN_CLIENT_CONFIG secret (see deploy/swarm/xray-client-config.example.json
  # for its shape) — never committed, since it embeds a real client UUID and
  # Reality keys.
  vpn-client:
    image: ghcr.io/xtls/xray-core:latest
    networks:
      - worker-net
    configs:
      - source: xray_client_config
        target: /usr/local/etc/xray/config.json
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.15'
          memory: 64M
      labels:
        app: bridge
        component: vpn-client

  # Runs Worker jobs and chat turns. Deliberately on its own network with no
  # path to backend/frontend or Postgres — worker talks to bridge only via
  # its public BRIDGE_API_URL, same as any other machine client (sync-cli,
  # reports), and its own blast radius (claude CLI's
  # --dangerously-skip-permissions runs unattended, genuinely arbitrary code
  # execution against task content) should never extend to bridge's own
  # database or secrets.
  worker:
    image: ${CR_HOST:?CR_HOST is required}/${CR_REGISTRY:?CR_REGISTRY is required}/${CR_WORKER_IMAGE:?CR_WORKER_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - worker-net
    environment:
      BRIDGE_API_URL: ${WORKER_BRIDGE_API_URL:?WORKER_BRIDGE_API_URL is required}
      BRIDGE_API_KEY: ${WORKER_BRIDGE_API_KEY:?WORKER_BRIDGE_API_KEY is required}
      CLAUDE_CODE_OAUTH_TOKEN: ${WORKER_CLAUDE_CODE_OAUTH_TOKEN:?WORKER_CLAUDE_CODE_OAUTH_TOKEN is required}
      OPENAI_API_KEY: ${WORKER_OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${WORKER_DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${WORKER_QWEN_API_KEY:-}
      WORKER_NAME: swarm-worker
      # Scoped to AI-provider calls only (OpenAI-compatible fetches, and the
      # claude CLI's own env) — never bridge's own API, which is reachable
      # directly from this host. See worker/README.md.
      # Must be http://, not socks5:// — see xray-client-config.example.json's
      # own comment for why (the claude CLI and undici's ProxyAgent both only
      # understand HTTP-style proxies).
      WORKER_PROXY_URL: http://vpn-client:1080
    depends_on:
      - vpn-client
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          memory: 128M
      labels:
        app: bridge
        component: worker

configs:
  # Swarm configs are immutable — deploying the same config name with
  # different content fails ("only updates to Labels are allowed"). Naming it
  # with a content hash means a changed VPN_CLIENT_CONFIG creates a fresh
  # Swarm object instead of trying to mutate the old one; --prune removes the
  # one nothing references anymore once the service picks up the new name.
  xray_client_config:
    file: ${VPN_CLIENT_CONFIG_FILE:?VPN_CLIENT_CONFIG_FILE is required}
    name: xray_client_config_${VPN_CLIENT_CONFIG_HASH:?VPN_CLIENT_CONFIG_HASH is required}

networks:
  bridge:
    driver: overlay
    attachable: true
  worker-net:
    driver: overlay
    attachable: true
