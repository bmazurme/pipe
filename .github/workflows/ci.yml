name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.18.0'

jobs:
  protocol:
    name: protocol (build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        working-directory: packages/protocol
        run: npm run lint

      - name: Build
        working-directory: packages/protocol
        run: npm run build

      - name: Unit tests (includes the sync/reports interop round-trip)
        working-directory: packages/protocol
        run: node --test 'dist/**/*.test.js'

  harness:
    name: harness (build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        working-directory: harness
        run: npm run lint

      - name: Build
        working-directory: harness
        run: npm run build

      - name: Unit tests
        working-directory: harness
        run: node --test 'dist/**/*.test.js'

  sync:
    name: sync (build, tests)
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/protocol

      - run: npm ci
        working-directory: sync
      - name: Lint
        working-directory: sync
        run: npm run lint
      - run: npm run build
        working-directory: sync
      - run: node --test --test-concurrency=1 'dist/**/*.test.js'
        working-directory: sync

  worker:
    name: worker (build, tests)
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/protocol

      - run: npm ci
        working-directory: worker
      - name: Lint
        working-directory: worker
        run: npm run lint
      - run: npm run build
        working-directory: worker
      - run: node --test 'dist/**/*.test.js'
        working-directory: worker

  reports:
    name: reports (build, tests)
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/protocol

      # reports has its own nested npm workspaces (packages/client, server,
      # shared) — installed and run from its own root, same as it is today.
      - run: npm ci
        working-directory: reports

      - name: Build shared
        run: npm run build --workspace=packages/shared
        working-directory: reports

      - name: Server lint
        run: npm run lint --workspace=packages/server
        working-directory: reports
      - name: Server typecheck
        run: npm run typecheck --workspace=packages/server
        working-directory: reports
      - name: Server tests
        run: npm test --workspace=packages/server
        working-directory: reports

      - name: Client lint
        run: npm run lint --workspace=packages/client
        working-directory: reports
      - name: Client build
        run: npm run build --workspace=packages/client
        working-directory: reports
      - name: Client tests
        run: npm test --workspace=packages/client
        working-directory: reports

  bridge:
    name: bridge (lint, build, tests)
    runs-on: ubuntu-latest
    needs: protocol
    # Backs both the e2e suite (needs a real DB — previously skipped in CI
    # entirely, see IMPROVEMENTS_TECH.md 4.2) and the migration-drift check
    # below (5.4) — POSTGRES_DB is the e2e suite's own expected ntlstl-db-test
    # name directly, so no separate create-database step is needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntlstl-db-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/protocol

      # bridge has its own nested npm workspaces (apps/backend, apps/frontend)
      # — installed and run from its own root, same as it is today. Lifted
      # from bridge/.github/workflows/ci.yml, which GitHub Actions no longer
      # discovers now that bridge is a subtree instead of a repo root.
      - run: npm ci
        working-directory: bridge

      - name: Backend ESLint
        working-directory: bridge/apps/backend
        run: npx eslint "{src,test}/**/*.ts"
      - name: Backend build
        run: npm run build -w backend
        working-directory: bridge
      - name: Backend unit tests
        run: npm test -w backend -- --passWithNoTests
        working-directory: bridge

      # Dummy-but-well-formed values — nothing here needs to be real, only
      # present, since nothing in the e2e suite or migration-check actually
      # exercises Yandex OAuth or signs a token anyone outside this job ever
      # verifies.
      - name: Backend e2e tests
        working-directory: bridge
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntlstl-db-test
          JWT_SECRET: ci-access-secret
          REFRESH_JWT_SECRET: ci-refresh-secret
          # base64, decodes to exactly 32 bytes — any value works, this one
          # is just a fixed placeholder so CI runs are reproducible.
          CREDENTIALS_ENC_KEY: 'lSEY5qf7avV5z3N5+QgTVnqxo9UNI4k2B4+nuLK0YZQ='
          YANDEX_ID: ci-yandex-id
          YANDEX_SECRET: ci-yandex-secret
          BRIDGE_YANDEX_REDIRECT: http://localhost:3002/api/v1/oauth/yandex/redirect
          BRIDGE_TARGET_URL: http://localhost:5173
          COOKIE_DOMAIN: localhost
          CORS_ORIGINS: http://localhost:5173
        run: npm run test:e2e -w backend

      # Informational only (not `needs`-gated into job failure): some
      # pre-existing hand-written migrations named their FK/index constraints
      # differently than TypeORM's own migration:generate would today, so
      # this currently reports a cosmetic (not structural) diff unrelated to
      # anything an entity-only change would introduce. Surfacing it rather
      # than skipping it entirely still catches *new* drift from here on;
      # tightening this into a hard gate is its own follow-up once that
      # pre-existing naming mismatch is cleaned up.
      - name: Backend migration drift check (informational)
        working-directory: bridge
        continue-on-error: true
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntlstl-db-test
        run: npm run migration:check -w backend

      # Catches a controller/DTO change that didn't regenerate the committed
      # OpenAPI spec (see IMPROVEMENTS_TECH.md 2.2) — openapi:check
      # regenerates openapi.json and fails if that produces a diff.
      - name: Backend OpenAPI spec drift check
        working-directory: bridge
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ntlstl-db-test
          JWT_SECRET: ci-access-secret
          REFRESH_JWT_SECRET: ci-refresh-secret
          CREDENTIALS_ENC_KEY: 'lSEY5qf7avV5z3N5+QgTVnqxo9UNI4k2B4+nuLK0YZQ='
          YANDEX_ID: ci-yandex-id
          YANDEX_SECRET: ci-yandex-secret
          BRIDGE_YANDEX_REDIRECT: http://localhost:3002/api/v1/oauth/yandex/redirect
          BRIDGE_TARGET_URL: http://localhost:5173
          COOKIE_DOMAIN: localhost
          CORS_ORIGINS: http://localhost:5173
        run: npm run openapi:check -w backend

      # Regenerates packages/protocol's TS types from that same spec and
      # fails if they've drifted — the one check here that doesn't need
      # Postgres (pure text transform over the already-committed
      # openapi.json), but lives in this job since it depends on the step
      # above having just confirmed that file itself is current.
      - name: protocol OpenAPI types drift check
        run: npm run openapi:check --workspace=packages/protocol

      - name: Frontend ESLint
        run: npm run lint -w frontend
        working-directory: bridge
      - name: Frontend production build
        working-directory: bridge/apps/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          echo "VITE_API_URL=${VITE_API_URL:-http://localhost:3002}" > .env.production
          npm run build
      - name: Frontend unit tests
        run: npm test -w frontend
        working-directory: bridge
