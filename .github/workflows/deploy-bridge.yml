# Deploys bridge (apps/backend + apps/frontend under bridge/) to the same
# Docker Swarm stack that bmazurme/bridge's own build.yml has been deploying
# to — this is meant to replace that pipeline, not run alongside it.
#
# Before the first real run, copy every secret bmazurme/bridge's build.yml
# uses into this repo (Settings -> Secrets and variables -> Actions) — their
# values aren't visible to anyone but you, so this can't be scripted:
#
#   YC_SA_JSON_CREDENTIALS, CR_HOST, CR_REGISTRY, CR_BACKEND_IMAGE,
#   CR_FRONTEND_IMAGE, SWARM_HOST, SWARM_USER, SWARM_SSH_KEY,
#   SWARM_SSH_KNOWN_HOSTS, POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER,
#   POSTGRES_PASSWORD, POSTGRES_DB, JWT_SECRET, REFRESH_JWT_SECRET,
#   YANDEX_ID, YANDEX_SECRET, BRIDGE_YANDEX_REDIRECT, BRIDGE_TARGET_URL,
#   COOKIE_DOMAIN, EMAILS, CORS_ORIGINS, TIME_EXPORT_API_KEY,
#   TIME_EXPORT_USER_ID, VITE_API_URL, BACKEND_PUBLISHED_PORT,
#   FRONTEND_PUBLISHED_PORT, HOST
#
# New for worker + its VPN sidecar (see worker/README.md and
# deploy/swarm/xray-client-config.example.json for the shape these feed):
#
#   CR_WORKER_IMAGE, WORKER_BRIDGE_API_URL, WORKER_BRIDGE_API_KEY,
#   WORKER_CLAUDE_CODE_OAUTH_TOKEN, WORKER_OPENAI_API_KEY (optional),
#   WORKER_DEEPSEEK_API_KEY (optional), WORKER_QWEN_API_KEY (optional),
#   VPN_CLIENT_CONFIG (the full Xray client config.json content — embeds a
#   real client UUID and Reality keys, never committed to the repo)
#
# New for bridge backend's /api/v1/vpn/* (see bridge/apps/backend/src/vpn/):
#
#   VPN_PANEL_URL, VPN_PANEL_API_TOKEN (ihor's x-ui panel — status, and the
#   source of truth the "sync" button rebuilds VPN_CLIENT_CONFIG from),
#   VPN_SERVER_ADDRESS (the VPN server's own IP, used in the rebuilt
#   client config), BRIDGE_GITHUB_TOKEN (a PAT scoped to this repo only —
#   Actions secrets: write, Actions: write — lets the backend push worker
#   secrets and trigger this same workflow on the admin's behalf; named
#   BRIDGE_GITHUB_TOKEN, not GITHUB_TOKEN, since the latter is a reserved
#   name GitHub Actions auto-populates with a different, more limited token)
#
#   CLAUDE_CODE_OAUTH_TOKEN (optional — powers GET /api/v1/vpn/claude-usage,
#   the usage-limits widget on the VPN page; its own token, separate from
#   WORKER_CLAUDE_CODE_OAUTH_TOKEN above, since GitHub Actions secrets are
#   write-only and bridge can't read worker's copy back. Left unset, that
#   one endpoint errors and the rest of the page works as normal)
#
# Deliberately workflow_dispatch-only for now — run it manually from the
# Actions tab (against main) until one run has deployed successfully. Once
# proven, switch this to the commented block below and disable
# bmazurme/bridge's build.yml (its trigger -> workflow_dispatch, or remove
# the file) so only one pipeline can ever deploy the "bridge" stack.
#
# on:
#   push:
#     branches:
#       - main
#   release:
#     types:
#       - created
#   workflow_dispatch:
#     inputs:
#       keep_images:
#         description: 'How many images to keep on the swarm node (for rollback)'
#         required: false
#         default: '3'
name: Deploy bridge

on:
  workflow_dispatch:
    inputs:
      keep_images:
        description: 'How many images to keep on the swarm node (for rollback)'
        required: false
        default: '3'

# One deploy at a time — two overlapping `docker stack deploy` runs against the
# same swarm would fight over the rolling update.
concurrency:
  group: deploy-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push backend image
        env:
          CR_HOST: ${{ secrets.CR_HOST }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_IMAGE: ${{ secrets.CR_BACKEND_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # The backend takes no build-time configuration: every value (DB,
          # JWT, OAuth) is read at runtime, so the build context needs nothing
          # beyond the source. Context is bridge/ (its own lockfile/workspace),
          # not this repo's root — see bridge/apps/backend/Dockerfile's own
          # header comment.
          docker build -f bridge/apps/backend/Dockerfile \
            -t "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG" bridge
          docker tag "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG" "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest"

          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG"
          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest"

      - name: Build and push frontend image
        env:
          CR_HOST: ${{ secrets.CR_HOST }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_IMAGE: ${{ secrets.CR_FRONTEND_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          # Vite inlines VITE_API_URL into the bundle at build time, so it has
          # to be a build arg, not a runtime env var. Context is this repo's
          # root, not bridge/ — apps/frontend depends on @pipe/protocol via
          # "file:../../../packages/protocol", which resolves outside a
          # context scoped to bridge/ alone (see the Dockerfile's own header
          # comment).
          docker build -f bridge/apps/frontend/Dockerfile \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            -t "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG" .
          docker tag "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG" "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest"

          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG"
          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest"

      - name: Build and push worker image
        env:
          CR_HOST: ${{ secrets.CR_HOST }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_IMAGE: ${{ secrets.CR_WORKER_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Context is this repo's root, not worker/ — worker depends on
          # @pipe/protocol via "file:../packages/protocol", which resolves
          # outside a context scoped to worker/ alone (see the Dockerfile's
          # own header comment).
          docker build -f worker/Dockerfile \
            -t "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG" .
          docker tag "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG" "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest"

          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:$IMAGE_TAG"
          docker push "$CR_HOST/$CR_REGISTRY/$CR_IMAGE:latest"

  deploy:
    name: Deploy to Docker Swarm
    needs: build
    # workflow_dispatch can technically be run against any branch — this
    # keeps a manual run from a feature branch from ever touching the real
    # stack. Re-add `|| github.event_name == 'release'` if the release
    # trigger above gets uncommented too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Safety net: nothing here should ever legitimately run this long. Without
    # this, a hung step (e.g. `docker service logs` waiting on a task that
    # never stabilizes) blocks the deploy-bridge concurrency group for up to
    # GitHub's default 6h job timeout instead of failing loudly.
    timeout-minutes: 30

    env:
      STACK_NAME: bridge
      # Deploy the exact image this run built, not :latest — the swarm records
      # the tag in the service spec, which is what makes rollbacks meaningful.
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_HOST: ssh://${{ secrets.SWARM_USER }}@${{ secrets.SWARM_HOST }}
      # ubuntu-latest's bundled Docker CLI has drifted ahead of the swarm
      # node's older daemon ("client version X.48 is too new. Maximum
      # supported API version is X.43") — pins the client to the daemon's
      # actual max supported version instead of negotiating the newest.
      DOCKER_API_VERSION: '1.43'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The runner's registry credentials are forwarded to the swarm nodes by
      # --with-registry-auth below, so the VM needs no docker login of its own.
      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Set up SSH access to the swarm manager
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
          SWARM_SSH_KNOWN_HOSTS: ${{ secrets.SWARM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SWARM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "$SWARM_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SWARM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use fallback. Set SWARM_SSH_KNOWN_HOSTS to pin the
            # host key instead of re-learning it on every run.
            echo "::warning::SWARM_SSH_KNOWN_HOSTS is not set — falling back to ssh-keyscan"
            ssh-keyscan -H "$SWARM_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host *
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Check the swarm is reachable
        run: |
          docker version --format 'daemon {{.Server.Version}} on {{.Server.Os}}/{{.Server.Arch}}'
          if [ "$(docker info --format '{{.Swarm.ControlAvailable}}')" != 'true' ]; then
            echo "::error::${{ secrets.SWARM_HOST }} is not a swarm manager — run bridge/deploy/swarm/bootstrap.sh on it first"
            exit 1
          fi

      # The Xray client config embeds a real client UUID and Reality keys, so
      # it lives only as a GitHub secret, never committed (see
      # bridge/deploy/swarm/xray-client-config.example.json for its shape) —
      # written to a file here, right before the one deploy step that needs
      # it, rather than kept around any longer than that.
      - name: Write the VPN client config
        env:
          VPN_CLIENT_CONFIG: ${{ secrets.VPN_CLIENT_CONFIG }}
        run: |
          umask 077
          printf '%s' "$VPN_CLIENT_CONFIG" > "$RUNNER_TEMP/xray-client-config.json"
          # Swarm configs are immutable, so the Swarm-side object name has to
          # change whenever the content does — see bridge-stack.yml's own
          # comment on the configs: block.
          echo "VPN_CLIENT_CONFIG_HASH=$(sha256sum "$RUNNER_TEMP/xray-client-config.json" | cut -c1-12)" >> "$GITHUB_ENV"

      # `docker stack deploy` ignores env_file, so every value is interpolated
      # here on the runner from GitHub secrets. Side effect: they are visible in
      # `docker service inspect` on the VM.
      - name: Deploy the stack
        env:
          CR_HOST: ${{ secrets.CR_HOST }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_BACKEND_IMAGE: ${{ secrets.CR_BACKEND_IMAGE }}
          CR_FRONTEND_IMAGE: ${{ secrets.CR_FRONTEND_IMAGE }}
          CR_WORKER_IMAGE: ${{ secrets.CR_WORKER_IMAGE }}
          BACKEND_PUBLISHED_PORT: ${{ secrets.BACKEND_PUBLISHED_PORT }}
          FRONTEND_PUBLISHED_PORT: ${{ secrets.FRONTEND_PUBLISHED_PORT }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REFRESH_JWT_SECRET: ${{ secrets.REFRESH_JWT_SECRET }}
          YANDEX_ID: ${{ secrets.YANDEX_ID }}
          YANDEX_SECRET: ${{ secrets.YANDEX_SECRET }}
          BRIDGE_YANDEX_REDIRECT: ${{ secrets.BRIDGE_YANDEX_REDIRECT }}
          BRIDGE_TARGET_URL: ${{ secrets.BRIDGE_TARGET_URL }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          EMAILS: ${{ secrets.EMAILS }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          TIME_EXPORT_API_KEY: ${{ secrets.TIME_EXPORT_API_KEY }}
          TIME_EXPORT_USER_ID: ${{ secrets.TIME_EXPORT_USER_ID }}
          WORKER_BRIDGE_API_URL: ${{ secrets.WORKER_BRIDGE_API_URL }}
          WORKER_BRIDGE_API_KEY: ${{ secrets.WORKER_BRIDGE_API_KEY }}
          WORKER_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.WORKER_CLAUDE_CODE_OAUTH_TOKEN }}
          WORKER_OPENAI_API_KEY: ${{ secrets.WORKER_OPENAI_API_KEY }}
          WORKER_DEEPSEEK_API_KEY: ${{ secrets.WORKER_DEEPSEEK_API_KEY }}
          WORKER_QWEN_API_KEY: ${{ secrets.WORKER_QWEN_API_KEY }}
          VPN_PANEL_URL: ${{ secrets.VPN_PANEL_URL }}
          VPN_PANEL_API_TOKEN: ${{ secrets.VPN_PANEL_API_TOKEN }}
          VPN_SERVER_ADDRESS: ${{ secrets.VPN_SERVER_ADDRESS }}
          BRIDGE_GITHUB_TOKEN: ${{ secrets.BRIDGE_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          VPN_CLIENT_CONFIG_FILE="$RUNNER_TEMP/xray-client-config.json" \
          docker stack deploy \
            --compose-file bridge/deploy/swarm/bridge-stack.yml \
            --with-registry-auth \
            --prune \
            "$STACK_NAME"

      - name: Clean up the VPN client config file
        if: always()
        run: rm -f "$RUNNER_TEMP/xray-client-config.json"

      - name: Wait for the rolling update to converge
        run: |
          services="${STACK_NAME}_backend ${STACK_NAME}_frontend ${STACK_NAME}_worker ${STACK_NAME}_vpn-client"
          # backend's update_config alone (start-first, 10s delay + 60s
          # monitor) plus image-pull time on the swarm node routinely takes
          # ~5 minutes end to end — a prior run finished at 307s, this one
          # missed a 300s deadline by ~30s despite deploying successfully.
          # 600s leaves real margin instead of racing the common case.
          deadline=$(( $(date +%s) + 600 ))

          for svc in $services; do
            while :; do
              state=$(docker service inspect --format \
                '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}completed{{end}}' "$svc")
              replicas=$(docker service ls --filter "name=$svc" --format '{{.Replicas}}')

              case "$state" in
                completed|'')
                  # Converged only once the running count matches the desired one.
                  if [ -n "$replicas" ] && [ "${replicas%%/*}" = "${replicas##*/}" ]; then
                    echo "$svc: $replicas ($state)"
                    break
                  fi
                  ;;
                rollback_completed|rollback_started|paused)
                  echo "::error::$svc failed to update and swarm rolled it back (state: $state)"
                  timeout 15 docker service ps --no-trunc "$svc" || true
                  timeout 30 docker service logs --tail 100 "$svc" || true
                  exit 1
                  ;;
              esac

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$svc did not converge in time (state: $state, replicas: $replicas)"
                timeout 15 docker service ps --no-trunc "$svc" || true
                timeout 30 docker service logs --tail 100 "$svc" || true
                exit 1
              fi
              sleep 5
            done
          done

      - name: Smoke test
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          BACKEND_PORT: ${{ secrets.BACKEND_PUBLISHED_PORT || '3300' }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PUBLISHED_PORT || '3305' }}
          PUBLIC_URL: ${{ secrets.HOST }}
        run: |
          # Published ports on the VM: what the reverse proxy talks to.
          ssh "$SWARM_USER@$SWARM_HOST" '
            set -e
            for i in $(seq 1 20); do
              if curl -sf "http://127.0.0.1:'"$BACKEND_PORT"'/" > /dev/null \
                 && curl -sf "http://127.0.0.1:'"$FRONTEND_PORT"'/" > /dev/null; then
                echo "backend/frontend ports on the VM: ok"
                exit 0
              fi
              sleep 3
            done
            echo "backend/frontend ports on the VM: FAILED" >&2
            exit 1
          '

          if [ -n "$PUBLIC_URL" ]; then
            for i in $(seq 1 8); do
              curl_log=$(mktemp)
              if ! code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$PUBLIC_URL/" 2>"$curl_log"); then
                # curl itself failed (DNS, connect, TLS, timeout) — this is a
                # network/DNS problem reaching $PUBLIC_URL from the runner,
                # not the same failure mode as a wrong proxy_pass (that shows
                # up as a non-200 HTTP response, handled below).
                echo "::error::curl could not reach $PUBLIC_URL on attempt $i: $(cat "$curl_log") — check the HOST secret is a valid, resolvable URL and that DNS for it is up (this is not the reverse proxy)"
                exit 1
              fi
              if [ "$code" != "200" ]; then
                echo "::error::$PUBLIC_URL returned $code on attempt $i — check the reverse proxy (proxy_pass must use 127.0.0.1, not localhost)"
                exit 1
              fi
            done
            echo "$PUBLIC_URL: 8/8 ok"
          else
            echo "::warning::HOST secret is not set — skipping the public smoke test"
          fi

      # Runs only after the smoke test passed, so a broken deploy still has its
      # old images sitting on the node to roll back to.
      - name: Clean up old images on the swarm node
        env:
          CR_HOST: ${{ secrets.CR_HOST }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY }}
          CR_BACKEND_IMAGE: ${{ secrets.CR_BACKEND_IMAGE }}
          CR_FRONTEND_IMAGE: ${{ secrets.CR_FRONTEND_IMAGE }}
          CR_WORKER_IMAGE: ${{ secrets.CR_WORKER_IMAGE }}
          KEEP_IMAGES: ${{ inputs.keep_images || '3' }}
        run: |
          clean_repo() {
            svc="${STACK_NAME}_$1"
            repo="$CR_HOST/$CR_REGISTRY/$2"

            all=$(docker images "$repo" --no-trunc --format '{{.ID}}' | sort -u)
            if [ -z "$all" ]; then
              echo "no images for $repo on the node"
              return 0
            fi

            # Whatever the live task actually runs, even after a rollback.
            in_use=$(docker ps -q --filter "label=com.docker.swarm.service.name=$svc" \
              | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null || true)

            # …plus the N newest, so `docker service rollback` does not have to
            # re-pull from the registry.
            recent=$(docker images "$repo" --no-trunc --format '{{.CreatedAt}}|{{.ID}}' \
              | sort -r | head -n "$KEEP_IMAGES" | cut -d'|' -f2)

            keep=$(printf '%s\n%s\n' "$in_use" "$recent" | grep . | sort -u)
            stale=$(comm -23 <(printf '%s\n' "$all") <(printf '%s\n' "$keep"))

            if [ -z "$stale" ]; then
              echo "$repo: nothing to remove (keeping $(printf '%s\n' "$keep" | wc -l) images)"
            else
              echo "$repo: removing $(printf '%s\n' "$stale" | wc -l) stale image(s):"
              printf '%s\n' "$stale" | xargs -r -n1 docker image rm || true
            fi
          }

          clean_repo backend "$CR_BACKEND_IMAGE"
          clean_repo frontend "$CR_FRONTEND_IMAGE"
          clean_repo worker "$CR_WORKER_IMAGE"

          docker system df

      - name: Service state on failure
        if: failure()
        # `docker service logs` can hang indefinitely over an ssh:// DOCKER_HOST
        # when a task never fully stabilizes (seen in practice: a deploy that
        # actually converged just past the "Wait" step's deadline left this
        # diagnostic step running for 1.5+ hours). timeout guarantees this step
        # fails loudly instead of blocking the deploy-bridge concurrency group.
        run: |
          timeout 15 docker stack ps --no-trunc "$STACK_NAME" || true
          timeout 30 docker service logs --tail 100 "${STACK_NAME}_backend" || true
          timeout 30 docker service logs --tail 100 "${STACK_NAME}_frontend" || true
          timeout 30 docker service logs --tail 100 "${STACK_NAME}_worker" || true
          timeout 30 docker service logs --tail 100 "${STACK_NAME}_vpn-client" || true
