# Cypress existed in reports/packages/client but was never actually run in
# CI (see IMPROVEMENTS_TECH.md 4.5) — partly because nothing wired it up,
# and partly because its own cypress.config.ts pointed at the wrong dev-server
# port (fixed separately). Nightly rather than per-push: these tests drive a
# real client+server pair end to end, slower and more failure-prone than the
# unit suites that already run on every push.
name: Nightly reports e2e

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '22.18.0'

jobs:
  cypress:
    name: reports client (Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/protocol

      - run: npm ci
        working-directory: reports

      # Temporary diagnostic for a failure not reproducible locally (macOS,
      # twice, nested and non-nested) — Cypress's own run showed
      # "Cannot find package 'express'" from reports/packages/server/src/index.ts
      # right after an apparently-clean `npm ci`. Remove once root-caused.
      - name: Debug express resolution
        working-directory: reports
        run: |
          echo "--- node/npm versions ---"
          node --version
          npm --version
          echo "--- reports/node_modules/express ---"
          ls -la node_modules/express/package.json 2>&1 || echo "MISSING at reports/node_modules/express"
          echo "--- reports/packages/server/node_modules/express ---"
          ls -la packages/server/node_modules/express/package.json 2>&1 || echo "MISSING at packages/server/node_modules/express"
          echo "--- node resolution from within packages/server ---"
          cd packages/server && node -e "import('express').then(m => console.log('resolved OK from packages/server:', typeof m.default)).catch(e => console.error('FAILED from packages/server:', e.message))"
          echo "--- which tsx does npx pick? ---"
          npx --no-install which tsx 2>&1 || echo "npx --no-install could not find a local tsx"
          echo "--- npx tsx's own resolution (the actual failing invocation path) ---"
          npx tsx -e "import('express').then(m => console.log('tsx resolved OK:', typeof m.default)).catch(e => console.error('tsx FAILED:', e.message))" 2>&1 || true
          echo "--- back at reports/, same check via --workspace ---"
          cd ../.. && npm exec --workspace=packages/server -- tsx -e "import('express').then(m => console.log('npm exec tsx resolved OK:', typeof m.default)).catch(e => console.error('npm exec tsx FAILED:', e.message))" 2>&1 || true
          echo "--- the REAL command: --watch loading the actual file (timeout 8s, SIGTERM after) ---"
          cd packages/server && (npx tsx --env-file=.env --watch src/index.ts & pid=$!; sleep 8; kill $pid 2>/dev/null; wait $pid 2>/dev/null; true)

      - name: Build shared
        run: npm run build --workspace=packages/shared
        working-directory: reports

      # .env is gitignored (a local dev convention — an empty file is all
      # that's actually required, settings/secrets live in settings.json,
      # which getSettings() falls back to defaults for if missing) — a
      # fresh CI checkout never has one, and tsx's own --env-file flag
      # hard-errors ("node: .env: not found") rather than tolerating a
      # missing file, confirmed in CI.
      - name: Create an empty .env for reports' server
        run: touch reports/packages/server/.env

      - name: Run Cypress against the real dev server pair
        uses: cypress-io/github-action@v6
        with:
          working-directory: reports/packages/client
          # cypress-io/github-action runs every `start` command from
          # `working-directory` above — reports/packages/client — via a
          # direct spawn, no shell, using its own naive whitespace tokenizer
          # that doesn't strip quote characters from a quoted argument
          # (confirmed in CI, twice: a bare `cd ../.. && ...` fails with
          # "Unable to locate executable file: cd", since cd is a shell
          # builtin, not a binary on PATH; wrapping it as `sh -c "..."`
          # fails too, with the literal quotes surviving into sh's argv and
          # sh trying to run one "command" whose name is the entire quoted
          # string). The server command needs to land in reports/ (the
          # actual npm workspace root for `--workspace=packages/server`)
          # rather than `--prefix ../..`: reports/ sits nested inside this
          # repo's own outer workspace (packages/protocol, harness, ...),
          # and npm's workspace discovery walks up from cwd regardless of
          # --prefix, so `--prefix ../.. --workspace=packages/server` run
          # from inside reports/packages/client resolves against the
          # *outer* repo root instead and fails with "No workspaces found".
          # A real script file sidesteps the tokenizer entirely — one bare
          # path, nothing with embedded spaces/quotes to mis-parse. Needs to
          # be an absolute path, not relative: the action's own existence
          # check for a "start" command (@actions/io's `which()`) resolves a
          # path-like string against *its own* process cwd, not against
          # `working-directory` above — a relative `../../scripts/...` here
          # failed with "Unable to locate executable file", confirmed in CI,
          # even though the identical relative path worked when run by hand
          # from reports/packages/client. ${{ github.workspace }} is always
          # the checkout root, so this resolves the same regardless of which
          # cwd the action's internal check uses.
          start: ${{ github.workspace }}/reports/scripts/start-server-for-e2e.sh, npm run dev
          wait-on: 'http://localhost:4000, http://localhost:5174'
          wait-on-timeout: 60
