# Cypress existed in reports/packages/client but was never actually run in
# CI (see IMPROVEMENTS_TECH.md 4.5) — partly because nothing wired it up,
# and partly because its own cypress.config.ts pointed at the wrong dev-server
# port (fixed separately). Nightly rather than per-push: these tests drive a
# real client+server pair end to end, slower and more failure-prone than the
# unit suites that already run on every push.
name: Nightly reports e2e

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '22.18.0'

jobs:
  cypress:
    name: reports client (Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/protocol

      - run: npm ci
        working-directory: reports

      - name: Build shared
        run: npm run build --workspace=packages/shared
        working-directory: reports

      # .env is gitignored (a local dev convention — an empty file is all
      # that's actually required, settings/secrets live in settings.json,
      # which getSettings() falls back to defaults for if missing) — a
      # fresh CI checkout never has one, and tsx's own --env-file flag
      # hard-errors ("node: .env: not found") rather than tolerating a
      # missing file, confirmed in CI.
      - name: Create an empty .env for reports' server
        run: touch reports/packages/server/.env

      # cypress-io/github-action's own "start" feature is deliberately not
      # used here (see git history on this file for the full saga) — its
      # internal process-spawning for "start" commands (no shell, its own
      # whitespace tokenizer, @actions/io's own cwd-independent `which()`)
      # had three confirmed quirks, the last of which was never actually
      # solved: the real server command, run exactly the same way, failed
      # with "Cannot find package 'express'" only when this action spawned
      # it — every other way of running the identical command (plain `run:`
      # step, `node -e`, `npx tsx -e`, `npm exec --workspace=...`) resolved
      # it fine. Starting both processes ourselves as plain `run:` steps
      # sidesteps the action's spawning mechanism entirely, so it's never in
      # a position to hit that bug again — this action is now used only for
      # its Cypress binary install/cache and the actual `cypress run`.
      - name: Start reports' server (background)
        run: ${{ github.workspace }}/reports/scripts/start-server-for-e2e.sh > /tmp/reports-server.log 2>&1 &

      - name: Start reports' client (background)
        working-directory: reports
        # --prefix instead of working-directory here would hit the exact
        # same "npm's workspace discovery walks up from cwd regardless of
        # --prefix" bug this file already spent a whole debugging session
        # on (see git history) — working-directory actually changes the
        # shell's cwd before npm runs, so workspace discovery finds
        # reports/package.json on its own, no flag needed.
        run: npm run dev --workspace=packages/client > /tmp/reports-client.log 2>&1 &

      - name: Wait for server + client to be ready
        run: |
          for i in $(seq 1 60); do
            server_up=0; client_up=0
            curl -s -o /dev/null http://localhost:4000 && server_up=1
            curl -s -o /dev/null http://localhost:5174 && client_up=1
            if [ "$server_up" = "1" ] && [ "$client_up" = "1" ]; then
              echo "server + client both responding"
              exit 0
            fi
            sleep 1
          done
          echo "::error::timed out waiting for reports' server/client to come up"
          echo "--- server log ---"; cat /tmp/reports-server.log || true
          echo "--- client log ---"; cat /tmp/reports-client.log || true
          exit 1

      - name: Run Cypress against the real dev server pair
        uses: cypress-io/github-action@v6
        with:
          working-directory: reports/packages/client

      # Cypress captures these on any failure by default (screenshotOnRunFailure,
      # and video recording) — they just weren't going anywhere before. Needed
      # to actually see what a failing test's page looked like instead of
      # guessing from the text assertion alone.
      - name: Upload Cypress screenshots/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-artifacts
          path: |
            reports/packages/client/cypress/screenshots
            reports/packages/client/cypress/videos
          retention-days: 5

      - name: Upload server/client logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-dev-server-logs
          path: |
            /tmp/reports-server.log
            /tmp/reports-client.log
          retention-days: 5
