[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab"
version = "0.1.0"
description = "Lab — MVP of a modular CAD/calc/BOM pipeline: domain-agnostic core, vehicle classes (boat, aircraft, ...) as plugins."
requires-python = ">=3.10"
dependencies = [
    "build123d>=0.9",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lab"]
