[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab"
version = "0.1.0"
description = "Lab — MVP of a modular CAD/calc/BOM pipeline: domain-agnostic core, vehicle classes (boat, aircraft, ...) as plugins."
requires-python = ">=3.10"
dependencies = [
    "build123d>=0.9",
    "pyyaml>=6.0",
]

# `lab run`/`measure`/`stats` never import flask — only `lab serve` does, lazily, with a
# clear error naming this extra if it's missing. Optional because most of Lab's value (the
# calc/BOM/export pipeline) has nothing to do with a web form, and most of its dependency
# weight (build123d/OCP) already comes from that, not from this.
[project.optional-dependencies]
web = ["flask>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["lab"]
