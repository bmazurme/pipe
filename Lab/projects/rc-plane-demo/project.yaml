# Second demo project, in a different domain — exists to prove that switching
# vehicle class costs nothing in `lab/core`, only a new project.yaml + domain module.
# The wing is a flat-plate placeholder, not a real airfoil — see
# lab/domains/aircraft/geometry.py.
name: "RC-самолёт (трейнер) — демо v1"
domain: aircraft

params:
  wingspan_mm: 1000
  root_chord_mm: 180
  tip_chord_mm: 120
  thickness_ratio: 0.12
  wing_material: balsa

targets:
  wing_loading_target_g_dm2: 40
  budget_rub: 3500

purchased_bom:
  - part: "Мотор бесколлекторный (парковый класс)"
    source: purchased
    qty: 1
    unit_cost_rub: 600
    unit_mass_kg: 0.040
  - part: "Регулятор оборотов (ESC) 20A"
    source: purchased
    qty: 1
    unit_cost_rub: 450
    unit_mass_kg: 0.025
  - part: "Аккумулятор LiPo 2S 800mAh"
    source: purchased
    qty: 1
    unit_cost_rub: 350
    unit_mass_kg: 0.045
  - part: "Сервопривод (руль высоты/направления)"
    source: purchased
    qty: 2
    unit_cost_rub: 150
    unit_mass_kg: 0.009
  - part: "Воздушный винт + кок"
    source: purchased
    qty: 1
    unit_cost_rub: 100
    unit_mass_kg: 0.005
