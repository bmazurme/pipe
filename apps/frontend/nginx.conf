server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints every file under /assets/ (the filename changes with
  # its content), so these can be cached forever — a new deploy always ships
  # a new URL, never a stale one under the old name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else isn't fingerprinted. index.html in particular must never
  # be cached — it's what points the browser at the current /assets/ bundle,
  # so a stale copy would keep serving an old (possibly 404ing) build.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
