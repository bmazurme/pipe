# bridge on the Raspberry Pi Swarm (temporary primary while Selectel is on hold; docs/ha-dr-plan.md).
#
#   infra/bridge-pi/deploy.sh                # from white, after secrets.sh and images are in place
#
# Core only: Postgres, backend, frontend, Caddy (TLS). worker and vpn-client come after the first
# sign-in (the worker needs a bridge API key). Everything stateful is pinned to the node labelled
# bridge-primary=true (white) — local volumes, one backend (it owns the schedulers and the Telegram
# long poll, so never run two).
#
# Images come from one of two places (deploy.sh decides): built for arm64 and loaded straight into the node
# (build-images.sh; the localhost/ names, `--resolve-image never`), or pulled from GHCR (`./deploy.sh ghcr [tag]`,
# images published by .github/workflows/publish-images.yml) — IMAGE_BACKEND / IMAGE_FRONTEND select the repository.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ntlstl-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    deploy:
      # 1 normally; the failover sets 0 — the database is then the promoted replica, and the old primary must not start
      replicas: ${POSTGRES_REPLICAS:-1}
      placement:
        constraints: [node.labels.bridge-primary == true]
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits: { cpus: '1.50', memory: 1G }
        reservations: { memory: 256M }

  backend:
    image: ${IMAGE_BACKEND:-localhost/pipe/bridge-backend}:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - internal
      - web
      - telegram-proxy-net
    environment:
      NODE_ENV: production
      PORT: 3000
      # `postgres` normally; the failover points it at the promoted replica (infra/failover)
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ntlstl-db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:?REFRESH_JWT_SECRET is required}
      CREDENTIALS_ENC_KEY: ${CREDENTIALS_ENC_KEY:?CREDENTIALS_ENC_KEY is required}
      # Where uploaded files live: the volume (local, default) or an S3 bucket (Garage, docs/ha-dr-plan.md).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      YANDEX_ID: ${YANDEX_ID:-}
      YANDEX_SECRET: ${YANDEX_SECRET:-}
      BRIDGE_YANDEX_REDIRECT: https://${API_HOST:-api.bridge.ntlstl.dev}/api/v1/oauth/yandex/redirect
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      BRIDGE_GITHUB_REDIRECT: https://${API_HOST:-api.bridge.ntlstl.dev}/api/v1/oauth/github/redirect
      BRIDGE_TARGET_URL: https://${APP_HOST:-bridge.ntlstl.dev}
      COOKIE_DOMAIN: ${API_HOST:-api.bridge.ntlstl.dev}
      CORS_ORIGINS: https://${APP_HOST:-bridge.ntlstl.dev}
      # Without an allowlist ANY Yandex account could register — required on a public host.
      EMAILS: ${EMAILS:?EMAILS is required}
      # Caddy runs in another container: trust X-Forwarded-For from private ranges, or every
      # client looks like one address (rate limits, sessions list). See src/config/trust-proxy.ts.
      TRUST_PROXY: uniquelocal
      # Telegram is blocked from here, so the bot goes out through the VPN client of the worker stack (a shared
      # network that holds only this backend and vpn-client) and receives updates by long polling — only one
      # consumer per bot may poll, so never run a second backend with the same token.
      TELEGRAM_PROXY_URL: http://vpn-client:1080
      TELEGRAM_POLLING: 'true'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Improve (analysis, issue runs, nightly schedules) and the loop's merge button talk to this repository.
      # Empty LOOP_GITHUB_TOKEN = Improve answers "GitHub не настроен". Fine-grained token, THIS repo only:
      # Issues RW, Pull requests RW, Contents RW, Checks R.
      GITHUB_REPO: ${GITHUB_REPO:-bmazurme/pipe}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}
      LOOP_GITHUB_TOKEN: ${LOOP_GITHUB_TOKEN:-}
    ports:
      # LAN-only checks (the router forwards only 80/443): curl http://<node>:3300/api/v1/health
      - target: 3000
        published: 3300
        protocol: tcp
        mode: ingress
    volumes:
      - bridge_uploads:/app/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/api/v1/health >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.bridge-primary == true]
      update_config:
        order: stop-first      # one backend only: it holds schedulers and the Telegram long poll
        failure_action: rollback
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits: { cpus: '1.00', memory: 768M }
        reservations: { memory: 128M }

  frontend:
    image: ${IMAGE_FRONTEND:-localhost/pipe/bridge-frontend}:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - web
    ports:
      - target: 80
        published: 3305
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.bridge-primary == true]
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits: { cpus: '0.25', memory: 128M }

  # TLS front. Ports are published in HOST mode so the backend sees real client addresses (ingress
  # mode would NAT them away). Certificates (Let's Encrypt, HTTP-01) need 80/443 forwarded to this
  # node and the domains pointing at the home address; the certificates live in the caddy_data volume.
  caddy:
    image: caddy:2-alpine
    networks:
      - web
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    environment:
      APP_HOST: ${APP_HOST:-bridge.ntlstl.dev}
      API_HOST: ${API_HOST:-api.bridge.ntlstl.dev}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.bridge-primary == true]
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits: { cpus: '0.50', memory: 128M }

networks:
  # attachable: a one-off `docker run --network bridge_internal` can reach postgres by name
  # (that is how infra/backup dumps the database).
  internal:
    driver: overlay
    attachable: true
  web:
    driver: overlay
  # created by deploy.sh / deploy-worker.sh (shared with the bridgew stack's vpn-client)
  telegram-proxy-net:
    external: true

volumes:
  pgdata:
  bridge_uploads:
  caddy_data:
  caddy_config:

configs:
  caddyfile:
    file: ./Caddyfile
    name: caddyfile_${CADDYFILE_HASH:?CADDYFILE_HASH is required}
